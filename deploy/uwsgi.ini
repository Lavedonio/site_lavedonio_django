# uWSGI app for one environment of the site (see deploy/README.md).
#
# deploy/setup-server.sh installs it as /etc/uwsgi/apps-enabled/<site user>.ini,
# with the site user and app port filled in (Debian's init script reads `uid`
# and `gid` literally, so they can't be uWSGI placeholders). It must stay owned
# by root: uWSGI reads it as root before dropping privileges. Debian's
# default.ini is loaded first (master, pidfile, /var/log/uwsgi/app/<site user>.log).
[uwsgi]
plugins = python312

# CloudPanel's Python vhost proxies every request to the site's app port, and
# serves the extensions it knows (css, js, svg, png...) from the document root.
http-socket = 127.0.0.1:APP_PORT
uid = SITE_USER
gid = SITE_USER
logfile-chown = true

# `current` is resolved when uWSGI starts and again on every reload. The Django
# project (manage.py) is in the repository's site_lavedonio_django/ folder.
chdir = /home/SITE_USER/app/current/site_lavedonio_django
virtualenv = /home/SITE_USER/app/current/.venv
module = site_lavedonio_django.wsgi:application
need-app = true
single-interpreter = true
enable-threads = true
# Load Django in the workers only. Otherwise the master keeps the variables read
# from .env in its environment, they survive every reload, and python-dotenv
# never overrides them: edits to .env would need a full restart.
lazy-apps = true

workers = 2
harakiri = 60
max-requests = 1000
reload-on-rss = 250

# Each deploy touches this file after switching `current` to the new release.
touch-reload = /home/SITE_USER/app/reload
