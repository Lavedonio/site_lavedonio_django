<a class="tag-chip{% if active and active == tag.pk %} tag-chip--active{% endif %}" style="--tag-color: {{ tag.color }}; --tag-background: {{ tag.background_color }};" href="{{ request.scheme }}://{{ request.get_host }}{{ tag.get_absolute_url }}">{{ tag }}{% if count %} <span class="tag-chip__count">{{ count }}</span>{% endif %}</a>
