{% extends 'base.html' %}
{% load i18n crispy_forms_tags %}
{% block canonical %}<meta name="robots" content="noindex">{% endblock %}
{% block language_alternates %}{% endblock %}
{% block bottom_notices %}{% endblock %}

{% block main_section %}
    <header class="font-poppins page-header page-header--light page-header--compact">
      <div class="container d-flex align-items-end">
        <div class="d-block">
          <h1 class="page-header__heading page-header__heading--light">{% translate "Log in" %}</h1>
          <div class="line line--light"></div>
        </div>
      </div>
    </header>

    <div class="container">
      <section class="login-section">
        <form method="post" action="{{ request.path }}" novalidate>
          {% csrf_token %}
          {% crispy form %}
          <input type="hidden" name="next" value="{{ next }}">
          <button class="btn btn-primary w-100" type="submit">{% translate "Log in" %}</button>
        </form>
      </section>
    </div>
{% endblock %}
